name: Release

on:
  push:
    # The version in Cargo.toml commands: when a merge to main brings one that
    # has no tag yet, the release is published from it. No tag to push by hand,
    # hence no possible drift between what the binary announces and what is
    # published.
    branches: [main]
    # A hand-pushed tag is still accepted — to republish, or for an earlier
    # version — but it must match Cargo.toml.
    tags: ['v*']
  # Lets the build matrix be exercised without publishing anything: the
  # binaries are produced as artifacts, no release is created.
  workflow_dispatch:

# Read-only by default; only the publishing job is granted write access.
permissions:
  contents: read

# Two close merges must not publish at the same time. We do not cancel either:
# a half-made release would be worse than two that follow each other.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Version to publish
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.decide.outputs.version }}
      tag: ${{ steps.decide.outputs.tag }}
      release: ${{ steps.decide.outputs.release }}

    steps:
      - uses: actions/checkout@v7
        with:
          # The tags, to know whether this version's already exists.
          fetch-depth: 0

      - name: Decide
        id: decide
        shell: bash
        run: |
          version="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          tag="v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

          if [ "$GITHUB_REF_TYPE" = tag ]; then
            # A tag that does not match would publish binaries announcing a
            # version other than their own. Stop before building.
            if [ "$GITHUB_REF_NAME" != "$tag" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} does not match version ${version} in Cargo.toml"
              exit 1
            fi
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "::notice::tag ${tag}: publishing."
          elif [ "$GITHUB_EVENT_NAME" = push ]; then
            if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              echo "release=false" >> "$GITHUB_OUTPUT"
              echo "::notice::version ${version} already published as ${tag}: nothing to do."
            else
              echo "release=true" >> "$GITHUB_OUTPUT"
              echo "::notice::version ${version} has no tag: publishing ${tag}."
            fi
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::manual dispatch: build only, no publication."
          fi

  build:
    name: ${{ matrix.name }}
    needs: version
    # An ordinary merge to main does not change the version: no point building
    # three targets for nothing.
    if: needs.version.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl produces a static binary, which starts on any distribution —
          # including a server with an outdated glibc, that is to say exactly
          # the machine where you want to drop a log analyser.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            name: refrain-linux-x86_64
            smoke: true
          - os: macos-latest
            target: aarch64-apple-darwin
            name: refrain-macos-arm64
            smoke: true
          # Cross-compiled from an arm64 runner: it therefore cannot be run
          # here to check it.
          - os: macos-latest
            target: x86_64-apple-darwin
            name: refrain-macos-x86_64
            smoke: false

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: musl linker
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install --yes musl-tools

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # The `dist` profile (see Cargo.toml) strips the binary and turns on LTO.
      - name: Build
        run: cargo build --locked --profile dist --target ${{ matrix.target }}

      - name: The binary starts
        if: matrix.smoke
        run: ./target/${{ matrix.target }}/dist/refrain --version

      # The archive name carries no version: that is what makes the URL
      # `releases/latest/download/refrain-linux-x86_64.tar.gz` usable. The
      # version stays in the inner directory, so you know what you extracted.
      - name: Archive
        id: archive
        shell: bash
        run: |
          if [ "${{ needs.version.outputs.release }}" = true ]; then
            version="${{ needs.version.outputs.version }}"
          else
            # Trial build: nothing ties it to a published version, the commit
            # is the only honest marker.
            version="$(git rev-parse --short HEAD)"
          fi
          name="${{ matrix.name }}-${version}"
          mkdir -p "dist/${name}"
          # The MIT licence requires the copyright notice to accompany every
          # copy of the software: it therefore travels with the binaries.
          cp target/${{ matrix.target }}/dist/refrain \
             target/${{ matrix.target }}/dist/genlogs \
             README.md LICENSE "dist/${name}/"
          tar -czf "dist/${{ matrix.name }}.tar.gz" -C dist "${name}"
          echo "archive=dist/${{ matrix.name }}.tar.gz" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ${{ steps.archive.outputs.archive }}
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [version, build]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    # Only this job can write to the repository, and it calls no third-party
    # action: publishing goes through the `gh` shipped with the runner.
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      # What it takes to check a downloaded archive: shasum -c SHA256SUMS
      - name: Checksums
        run: |
          cd artifacts
          sha256sum *.tar.gz | tee SHA256SUMS

      # `gh release create` lays the tag itself on `--target` if it does not
      # exist yet: that is what makes the merge sufficient, without pushing a
      # tag from a workflow.
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --target "$GITHUB_SHA" \
            --generate-notes \
            artifacts/*

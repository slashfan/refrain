name: Release

on:
  push:
    # La version de Cargo.toml commande : quand une fusion sur main en apporte
    # une qui n'a pas encore de tag, la release est publiée à partir d'elle.
    # Plus de tag à poser à la main, donc plus de dérive possible entre ce que
    # le binaire annonce et ce qui est publié.
    branches: [main]
    # Un tag posé à la main reste accepté — pour republier, ou pour une version
    # antérieure — mais il doit correspondre à Cargo.toml.
    tags: ['v*']
  # Permet d'éprouver la matrice de compilation sans rien publier : les binaires
  # sont produits en artefacts, aucune release n'est créée.
  workflow_dispatch:

# Lecture seule par défaut ; seul le job de publication obtient l'écriture.
permissions:
  contents: read

# Deux fusions rapprochées ne doivent pas publier en même temps. On ne les
# annule pas pour autant : une release à moitié faite serait pire que deux qui
# se suivent.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Version à publier
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.decide.outputs.version }}
      tag: ${{ steps.decide.outputs.tag }}
      release: ${{ steps.decide.outputs.release }}

    steps:
      - uses: actions/checkout@v7
        with:
          # Les tags, pour savoir si celui de cette version existe déjà.
          fetch-depth: 0

      - name: Décider
        id: decide
        shell: bash
        run: |
          version="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          tag="v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

          if [ "$GITHUB_REF_TYPE" = tag ]; then
            # Un tag qui ne correspond pas publierait des binaires annonçant
            # une autre version qu'eux-mêmes. On s'arrête avant de compiler.
            if [ "$GITHUB_REF_NAME" != "$tag" ]; then
              echo "::error::le tag ${GITHUB_REF_NAME} ne correspond pas à la version ${version} de Cargo.toml"
              exit 1
            fi
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "::notice::tag ${tag} : publication."
          elif [ "$GITHUB_EVENT_NAME" = push ]; then
            if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              echo "release=false" >> "$GITHUB_OUTPUT"
              echo "::notice::version ${version} déjà publiée sous ${tag} : rien à faire."
            else
              echo "release=true" >> "$GITHUB_OUTPUT"
              echo "::notice::version ${version} sans tag : publication de ${tag}."
            fi
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::lancement manuel : compilation seule, aucune publication."
          fi

  build:
    name: ${{ matrix.nom }}
    needs: version
    # Une fusion ordinaire sur main ne change pas la version : inutile de
    # compiler trois cibles pour rien.
    if: needs.version.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl produit un binaire statique, qui démarre sur n'importe quelle
          # distribution — y compris un serveur à la glibc dépassée, soit
          # exactement la machine où l'on veut poser un analyseur de logs.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            nom: refrain-linux-x86_64
            smoke: true
          - os: macos-latest
            target: aarch64-apple-darwin
            nom: refrain-macos-arm64
            smoke: true
          # Compilation croisée depuis un runner arm64 : on ne peut donc pas
          # l'exécuter ici pour la vérifier.
          - os: macos-latest
            target: x86_64-apple-darwin
            nom: refrain-macos-x86_64
            smoke: false

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Éditeur de liens musl
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install --yes musl-tools

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Le profil `dist` (voir Cargo.toml) dépouille le binaire et active le LTO.
      - name: Compilation
        run: cargo build --locked --profile dist --target ${{ matrix.target }}

      - name: Le binaire démarre
        if: matrix.smoke
        run: ./target/${{ matrix.target }}/dist/refrain --version

      # Le nom de l'archive ne porte pas la version : c'est ce qui rend l'URL
      # `releases/latest/download/refrain-linux-x86_64.tar.gz` utilisable. La
      # version reste dans le dossier interne, pour savoir ce qu'on a extrait.
      - name: Archive
        id: archive
        shell: bash
        run: |
          if [ "${{ needs.version.outputs.release }}" = true ]; then
            version="${{ needs.version.outputs.version }}"
          else
            # Compilation d'essai : rien ne la rattache à une version publiée,
            # le commit est le seul repère honnête.
            version="$(git rev-parse --short HEAD)"
          fi
          nom="${{ matrix.nom }}-${version}"
          mkdir -p "dist/${nom}"
          # La licence MIT impose que l'avis de copyright accompagne toute
          # copie du logiciel : elle voyage donc avec les binaires.
          cp target/${{ matrix.target }}/dist/refrain \
             target/${{ matrix.target }}/dist/genlogs \
             README.md LICENSE "dist/${nom}/"
          tar -czf "dist/${{ matrix.nom }}.tar.gz" -C dist "${nom}"
          echo "archive=dist/${{ matrix.nom }}.tar.gz" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.nom }}
          path: ${{ steps.archive.outputs.archive }}
          if-no-files-found: error

  publish:
    name: Publier la release
    needs: [version, build]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    # Seul ce job peut écrire dans le dépôt, et il n'appelle aucune action
    # tierce : la publication passe par le `gh` fourni par le runner.
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artefacts
          merge-multiple: true

      # De quoi vérifier une archive téléchargée : shasum -c SHA256SUMS
      - name: Empreintes
        run: |
          cd artefacts
          sha256sum *.tar.gz | tee SHA256SUMS

      # `gh release create` pose le tag lui-même sur `--target` s'il n'existe
      # pas encore : c'est ce qui rend la fusion suffisante, sans qu'on ait à
      # pousser un tag depuis un workflow.
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --target "$GITHUB_SHA" \
            --generate-notes \
            artefacts/*

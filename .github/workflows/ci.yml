name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# CI only reads the repository: no write permission is needed.
permissions:
  contents: read

# A new push cancels the run still in flight on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Tests · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # A macOS failure must not hide the Linux result, nor the other way round.
      fail-fast: false
      matrix:
        # Both, everywhere. While the repository was private a macOS minute was
        # billed ten times the Linux rate, so they only ran at merge time — and
        # a regression specific to macOS was caught after the fact. Rotation
        # detection reads the inode and the clipboard goes through OSC 52: the
        # two places where the systems actually diverge are exactly the ones
        # that were not covered before merging.
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      # Without a cache, every run rebuilds ratatui and its dependencies.
      - uses: Swatinem/rust-cache@v2

      # `--locked` forbids any change to Cargo.lock: we build exactly the
      # versions that are committed, not the ones published since.
      - name: Build (debug, all targets)
        run: cargo build --locked --all-targets

      # In debug, Rust checks integer overflow at run time. That is what
      # surfaces arithmetic bugs instead of silencing them.
      - name: Unit and end-to-end tests
        run: cargo test --locked

      - name: Build the distributable binary
        run: cargo build --locked --release

      - name: The release binary starts
        run: ./target/release/refrain --version

      # A guard, not a measurement: GitHub runners are far too variable for a
      # tight threshold. This very low floor — a million lines in ten seconds —
      # catches a tenfold collapse without flickering. Reduced corpus: CI has
      # no business spending a minute measuring.
      - name: Throughput has not collapsed
        if: runner.os == 'Linux'
        run: ./target/release/bench --requests 20000 --min 100000

  version:
    name: Version
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # The tags: they are what we compare against.
          fetch-depth: 0

      # The version in Cargo.toml commands publication (see release.yml).
      # Two things to check before a merge becomes a release.
      - name: The version does not move back, and announces what it will publish
        shell: bash
        run: |
          version="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          latest="$(git tag -l 'v*' | sed 's/^v//' | sort -V | tail -1)"

          if [ -z "$latest" ]; then
            echo "::notice::no published version yet: merging will publish v${version}."
            exit 0
          fi

          # `sort -V` compares version numbers, not text: without it, "0.10.0"
          # would look older than "0.9.0".
          oldest="$(printf '%s\n%s\n' "$version" "$latest" | sort -V | head -1)"
          if [ "$version" != "$latest" ] && [ "$oldest" = "$version" ]; then
            echo "::error::Cargo.toml announces ${version}, below the latest release v${latest}. A published version is not taken back: the merge would publish nothing, silently."
            exit 1
          fi

          if [ "$version" = "$latest" ]; then
            echo "::notice::version ${version} unchanged: merging will publish no release."
          else
            echo "::notice::merging this PR will publish v${version}."
          fi

  lint:
    name: Format and clippy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --check

      # Placed after `--`, `-D warnings` targets our own crates only: a warning
      # inside a dependency does not fail CI.
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

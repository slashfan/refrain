name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# La CI ne fait que lire le dépôt : aucun droit d'écriture n'est nécessaire.
permissions:
  contents: read

# Une nouvelle poussée annule la série encore en cours sur la même branche.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Tests · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Un échec sur macOS ne doit pas masquer le résultat de Linux, ni l'inverse.
      fail-fast: false
      matrix:
        # Le dépôt est privé : une minute macOS y est facturée dix fois le tarif
        # Linux. On ne les dépense donc que là où elles comptent — sur main, sur
        # les tags et en lancement manuel — et pas à chaque poussée dans une
        # pull request. Une régression propre à macOS est rattrapée à la fusion.
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-latest"]') }}

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      # Sans cache, chaque exécution recompile ratatui et ses dépendances.
      - uses: Swatinem/rust-cache@v2

      # `--locked` interdit toute modification de Cargo.lock : on compile
      # exactement les versions versionnées, pas celles publiées depuis.
      - name: Compilation (debug, toutes cibles)
        run: cargo build --locked --all-targets

      # En debug, Rust vérifie les dépassements d'entiers à l'exécution. C'est
      # ce qui fait remonter les bugs d'arithmétique au lieu de les taire.
      - name: Tests unitaires et de bout en bout
        run: cargo test --locked

      - name: Compilation du binaire distribuable
        run: cargo build --locked --release

      - name: Le binaire release démarre
        run: ./target/release/refrain --version

      # Garde-fou et non mesure : les runners GitHub sont bien trop variables
      # pour un seuil serré. Ce plancher très bas — un million de lignes en dix
      # secondes — attrape l'effondrement d'un facteur dix sans clignoter.
      # Corpus réduit : la CI n'a pas à passer une minute à mesurer.
      - name: Le débit ne s'est pas effondré
        if: runner.os == 'Linux'
        run: ./target/release/bench --requests 20000 --min 100000

  version:
    name: Version
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # Les tags : c'est à eux qu'on compare.
          fetch-depth: 0

      # La version de Cargo.toml commande la publication (voir release.yml).
      # Deux choses à vérifier avant qu'une fusion ne devienne une release.
      - name: La version ne recule pas, et annonce ce qu'elle publiera
        shell: bash
        run: |
          version="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          dernier="$(git tag -l 'v*' | sed 's/^v//' | sort -V | tail -1)"

          if [ -z "$dernier" ]; then
            echo "::notice::aucune version publiée : la fusion publiera v${version}."
            exit 0
          fi

          # `sort -V` compare des numéros de version, pas du texte : sans lui,
          # « 0.10.0 » passerait pour antérieur à « 0.9.0 ».
          plus_ancienne="$(printf '%s\n%s\n' "$version" "$dernier" | sort -V | head -1)"
          if [ "$version" != "$dernier" ] && [ "$plus_ancienne" = "$version" ]; then
            echo "::error::Cargo.toml annonce ${version}, en deçà de la dernière release v${dernier}. Une version publiée ne se reprend pas : la fusion ne publierait rien, en silence."
            exit 1
          fi

          if [ "$version" = "$dernier" ]; then
            echo "::notice::version ${version} inchangée : la fusion ne publiera pas de release."
          else
            echo "::notice::la fusion de cette PR publiera v${version}."
          fi

  lint:
    name: Format et clippy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatage
        run: cargo fmt --check

      # Placé après `--`, `-D warnings` ne vise que nos propres crates : un
      # avertissement chez une dépendance ne fait pas échouer la CI.
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

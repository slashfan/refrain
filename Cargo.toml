[package]
name = "refrain"
version = "0.6.0"
edition = "2024"
default-run = "refrain"
description = "Real-time Symfony/Monolog log analyser for your terminal"
repository = "https://github.com/slashfan/refrain"
license = "MIT"
readme = "README.md"
keywords = ["symfony", "monolog", "logs", "tui", "observability"]
categories = ["command-line-utilities", "development-tools::debugging"]
# Vérifié : 1.87 est refusé (ratatui 0.30 exige 1.88), 1.88 compile et
# passe les 74 tests.
rust-version = "1.88"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
# `rust_backend` plutôt que le zlib du système : le binaire musl doit rester
# statique, et démarrer sur une distribution qui n'a pas la bonne libz.
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
ratatui = "0.30.2"
serde_json = "1.0.151"

# Profil de distribution. Séparé de `release` pour que les binaires publiés
# soient dépouillés et compacts sans priver les builds locaux de leurs symboles
# de débogage — une trace d'exécution reste lisible avec `cargo build --release`.
[profile.dist]
inherits = "release"
strip = true
lto = true
codegen-units = 1

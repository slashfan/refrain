[package]
name = "refrain"
version = "0.7.0"
edition = "2024"
default-run = "refrain"
description = "Real-time Symfony/Monolog log analyser for your terminal"
repository = "https://github.com/slashfan/refrain"
license = "MIT"
readme = "README.md"
keywords = ["symfony", "monolog", "logs", "tui", "observability"]
categories = ["command-line-utilities", "development-tools::debugging"]
# Checked: 1.87 is refused (ratatui 0.30 requires 1.88), 1.88 builds and passes
# the test suite.
rust-version = "1.88"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
# `rust_backend` rather than the system zlib: the musl binary must stay static,
# and start on a distribution that lacks the right libz.
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
ratatui = "0.30.2"
serde_json = "1.0.151"

# Distribution profile. Kept apart from `release` so that published binaries are
# stripped and compact without depriving local builds of their debug symbols —
# a backtrace stays readable with `cargo build --release`.
[profile.dist]
inherits = "release"
strip = true
lto = true
codegen-units = 1

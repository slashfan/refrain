[package]
name = "refrain"
version = "0.4.0"
edition = "2024"
default-run = "refrain"
description = "Analyseur de logs Symfony/Monolog en temps réel dans le terminal"
repository = "https://github.com/slashfan/refrain"
license = "MIT"
readme = "README.md"
keywords = ["symfony", "monolog", "logs", "tui", "observability"]
categories = ["command-line-utilities", "development-tools::debugging"]
# Vérifié : 1.87 est refusé (ratatui 0.30 exige 1.88), 1.88 compile et
# passe les 41 tests.
rust-version = "1.88"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
ratatui = "0.30.2"
serde_json = "1.0.151"

# Profil de distribution. Séparé de `release` pour que les binaires publiés
# soient dépouillés et compacts sans priver les builds locaux de leurs symboles
# de débogage — une trace d'exécution reste lisible avec `cargo build --release`.
[profile.dist]
inherits = "release"
strip = true
lto = true
codegen-units = 1

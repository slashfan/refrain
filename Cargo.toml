[package]
name = "ruru"
version = "0.1.0"
edition = "2024"
default-run = "ruru"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
ratatui = "0.30.2"
serde_json = "1.0.151"

# Profil de distribution. Séparé de `release` pour que les binaires publiés
# soient dépouillés et compacts sans priver les builds locaux de leurs symboles
# de débogage — une trace d'exécution reste lisible avec `cargo build --release`.
[profile.dist]
inherits = "release"
strip = true
lto = true
codegen-units = 1
